name: infra

# Pipeline de infraestructura. Es dueno de la existencia y la configuracion
# de la funcion, y no toca la imagen.

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      autorizar_destruccion:
        description: 'Autorizo EXPLICITAMENTE que el plan destruya o reemplace recursos'
        type: boolean
        default: false

permissions:
  contents: read

# Nunca dos ejecuciones de Terraform a la vez sobre el mismo estado.
concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: 'true'
  TF_VERSION: '1.12.2'

defaults:
  run:
    working-directory: infra

jobs:

  # ---------------------------------------------------------------------------
  # B1 · Sintaxis e integridad: fmt, init (backend remoto) y validate
  # ---------------------------------------------------------------------------
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Credenciales temporales      # init habla con el backend en S3
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Formato
        run: terraform fmt -check -recursive -diff

      - name: Inicializacion contra el backend remoto
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Validacion
        run: terraform validate

  # ---------------------------------------------------------------------------
  # B2 · Analisis de politicas (Trivy IaC) · DETIENE con HIGH o CRITICAL
  # ---------------------------------------------------------------------------
  politicas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Politicas sobre el codigo declarado
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL      # a partir de aqui el hallazgo detiene
          exit-code: '1'               # esta compuerta SI detiene
          format: table
          output: trivy-infra.txt
          hide-progress: true

      - name: Resultado visible de politicas
        if: always()
        working-directory: .
        run: |
          {
            echo "### Politicas IaC (umbral: HIGH, CRITICAL)"
            echo
            echo '```'
            cat trivy-infra.txt 2>/dev/null || echo "(sin reporte)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # B3 · Plan + compuerta sobre el plan (se evalua el EFECTO, no el codigo)
  # ---------------------------------------------------------------------------
  plan:
    needs: [validar, politicas]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write      # para comentar el plan en el PR
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inicializacion
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Calcular el plan
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > tfplan.json
          terraform show -no-color tfplan > plan.txt

      # Regla 2 · publicar el plan legible (va ANTES de la regla 1 para que
      # quede visible aunque la compuerta detenga). Informa, no detiene.
      - name: Plan en el resumen de la ejecucion
        run: |
          {
            echo "### Plan de Terraform"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el plan en el pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8').slice(0, 60000);
            const marca = '<!-- plan-terraform-inf384 -->';
            const cuerpo = `${marca}\n### Plan de Terraform · \`${context.sha.substring(0,7)}\`\n\n\`\`\`terraform\n${plan}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comentarios } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const previo = comentarios.find(c => c.body && c.body.includes(marca));
            if (previo) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body: cuerpo });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: cuerpo });
            }

      # Regla 1 · ninguna destruccion sin autorizacion. Un reemplazo
      # (delete + create) tambien cuenta. La autorizacion solo puede venir de
      # una ejecucion MANUAL (workflow_dispatch) con la casilla marcada:
      # un acto humano, fuera del disparo automatico y fuera del propio cambio.
      - name: Compuerta · destruccion no autorizada
        env:
          EVENTO: ${{ github.event_name }}
          AUTORIZADO: ${{ inputs.autorizar_destruccion }}
          ACTOR: ${{ github.actor }}
        run: |
          destruidos=$(jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | "\(.address) [\(.change.actions | join("+"))]"' tfplan.json)
          if [ -z "$destruidos" ]; then
            echo "Sin destrucciones en el plan."
            echo "**Compuerta del plan: OK** (sin destrucciones)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$AUTORIZADO" = "true" ]; then
            echo "::warning title=Destruccion autorizada::Autorizada manualmente por ${ACTOR}: ${destruidos//$'\n'/, }"
            echo "**Compuerta del plan: destruccion AUTORIZADA por ${ACTOR}**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error title=Destruccion no autorizada::El plan destruye o reemplaza: ${destruidos//$'\n'/, }"
          {
            echo "**Compuerta del plan: DETENIDO.** Recursos que se destruirian:"
            echo
            echo '```'
            echo "$destruidos"
            echo '```'
            echo "Para autorizar: Actions > infra > Run workflow, marcando 'autorizar_destruccion'."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Guardar el plan para aplicarlo tal cual
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 1

  # ---------------------------------------------------------------------------
  # B4 · Aplicar el plan GUARDADO (sin recalcular) · solo rama principal
  # ---------------------------------------------------------------------------
  aplicar:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inicializacion
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Descargar el plan aprobado
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/

      - name: Aplicar el plan guardado
        run: terraform apply -input=false tfplan
